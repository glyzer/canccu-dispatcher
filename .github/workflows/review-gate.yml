# SPDX-License-Identifier: 0BSD
name: Review gate

# Machine gate for the independent review that canccu-dispatcher runs on every PR. Shipped by
# canccu-dispatcher as a template (templates/repo/.github/); its contract and setup:
# canccu-dispatcher's templates/README.md.
# Passes only when the newest "Review verdict: <pass|changes> <head sha>" comment by the
# reviewer identity (repo variable REVIEWER_LOGIN) says `pass` for the PR's current head.
# Comments by anyone else are ignored; with the variable unset the gate fails.
# No secrets, no LLM: the GITHUB_TOKEN only reads, except `actions: write` in the rerun job,
# and comment text is matched with jq, never executed.
on:
  pull_request:
    # edited: a base-branch change keeps the head SHA, so the gate re-checks it.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:

permissions: {}

# The job name `review-gate` is the required-check name for branch rules. Do not rename it.
jobs:
  review-gate:
    name: review-gate
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: review-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Merge queue entry
        if: github.event_name == 'merge_group'
        run: echo "::notice title=review-gate::Merge queue entry; the PR passed review-gate before it was queued."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Self-test the gate
        if: github.event_name == 'pull_request'
        run: .github/scripts/review-gate --self-test
      - name: Check the newest review verdict
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEWER_LOGIN: ${{ vars.REVIEWER_LOGIN }}
        run: |
          gh api --paginate "repos/$REPO/issues/$PR/comments" | jq -s 'add // []' > "$RUNNER_TEMP/comments.json"
          gh api --paginate "repos/$REPO/issues/$PR/timeline" | jq -s 'add // []' > "$RUNNER_TEMP/timeline.json"
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          .github/scripts/review-gate "$RUNNER_TEMP/comments.json" "$head" "$RUN_HEAD" "$RUNNER_TEMP/timeline.json"

  # A comment event runs on the default branch, so its own check would not land on the PR.
  # Instead, re-run the review-gate run of the PR's head, which then reads the comments again.
  # Fires on a reviewer comment that has (or, when edited, had) a verdict, and on any edit of
  # a reviewer comment (an edited reviewer comment fails the gate). Any other comment only
  # starts a skipped run.
  rerun-on-verdict:
    name: review-gate (rerun on verdict)
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      vars.REVIEWER_LOGIN != '' && github.event.comment.user.login == vars.REVIEWER_LOGIN &&
      (contains(github.event.comment.body, 'Review verdict:') ||
       contains(github.event.changes.body.from || '', 'Review verdict:') ||
       github.event.action == 'edited')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    concurrency:
      group: review-gate-rerun-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Re-run review-gate on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          read -r head href hrepo < <(gh api "repos/$REPO/pulls/$PR" \
            --jq '"\(.head.sha) \(.head.ref) \(.head.repo.full_name // "-")"')
          # Only this PR's run: same head SHA, branch and repo, and this PR number when
          # GitHub lists one (it lists none for fork PRs).
          for _ in $(seq 1 30); do
            run=$(gh api "repos/$REPO/actions/workflows/review-gate.yml/runs?event=pull_request&head_sha=$head&per_page=20" |
              jq -r --argjson pr "$PR" --arg ref "$href" --arg hrepo "$hrepo" '
                [ .workflow_runs[]
                  | select(.head_branch == $ref and .head_repository.full_name == $hrepo)
                  | select((.pull_requests | length) == 0 or any(.pull_requests[]; .number == $pr)) ]
                | first | select(.) | "\(.id) \(.status)"')
            case "${run#* }" in
              "")
                echo "::notice title=review-gate::No review-gate run for ${head:0:7} yet; it reads the verdict when it runs."
                exit 0 ;;
              completed)
                gh run rerun "${run%% *}" -R "$REPO"
                echo "Re-ran review-gate run ${run%% *} for ${head:0:7}."
                exit 0 ;;
              action_required|waiting)
                echo "::notice title=review-gate::Run ${run%% *} for ${head:0:7} waits for a maintainer's approval; it reads the verdict when it runs."
                exit 0 ;;
            esac
            sleep 15
          done
          echo "::error title=review-gate::run ${run%% *} for ${head:0:7} did not finish in time; re-run it by hand."
          exit 1
