# SPDX-License-Identifier: AGPL-3.0-or-later
# Release: on a v* tag, check that VERSION and CHANGELOG.md match the tag, run the local check,
# build canccu-dispatcher-<version>.tar.gz with git archive plus SHA256SUMS (and install-test the
# tarball), then publish a GitHub release with the changelog section as its notes. The steps are
# .github/scripts/release; tests/canccu-release.sh tests them. The workflow token only: no secret,
# and only the publishing job, which runs no repo code, may write.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# one run per tag; a second push of the same tag waits rather than racing the first
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag, VERSION and CHANGELOG.md
        run: .github/scripts/release check "$GITHUB_REF_NAME"

      - name: Monitor venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check -r lib/canccu-monitor.requirements.txt

      - name: Local check
        env:
          CANCCU_VENV: ${{ runner.temp }}/venv
          CANCCU_TEST_LOGS: ${{ runner.temp }}/test-logs
        run: tests/run

      - name: Full logs of a failed check
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/test-logs/*.log; do echo "::group::${f##*/}"; cat "$f"; echo "::endgroup::"; done

      # the notes go beside the assets in the artifact, but are not uploaded as one
      - name: Tarball, SHA256SUMS and notes
        run: |
          v=${GITHUB_REF_NAME#v}
          .github/scripts/release build "$v" dist
          .github/scripts/release-smoke "dist/canccu-dispatcher-$v.tar.gz"
          .github/scripts/release notes "$v" > "$RUNNER_TEMP/notes.md"
          mv "$RUNNER_TEMP/notes.md" dist/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "dist/canccu-dispatcher-$v.tar.gz" dist/SHA256SUMS -R "$GITHUB_REPOSITORY" \
            --verify-tag --title "canccu-dispatcher $v" --notes-file dist/notes.md
