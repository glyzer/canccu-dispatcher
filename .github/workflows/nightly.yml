# SPDX-License-Identifier: AGPL-3.0-or-later
# Nightly: the whole suite on Debian 12, the check CI only runs in short (tests/run --short) on
# every push. A red night opens an issue (or comments on the open one) for a person to decide: it
# is never labelled ready. release.yml runs the same job before it publishes; tests/canccu-ci.sh
# keeps the two copies equal. No secrets; only `report` writes, and only issues.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  oldstable:
    name: Debian 12 (full)
    runs-on: ubuntu-latest
    # the whole suite on Debian 12's own bash, jq 1.6, tmux, Python 3.11 and git: jq 1.6 starts
    # about 8 times slower than 1.7, so the run takes about an hour of the 60 minutes it gets, and
    # each test file gets 20 minutes, not 8. CI runs the short set there on every push instead.
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: debian:12
      # --init: tini as PID 1 reaps orphaned processes, as a host does; without it they stay as
      # zombies and the full run hits the process limit (#353)
      options: --init
    outputs:
      failed: ${{ steps.failed.outputs.failed }}
    steps:
      # git before the checkout: without it, checkout fetches a tarball, and the tests need a repo
      - name: Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates coreutils procps util-linux bash jq tmux python3 python3-venv git shellcheck > /dev/null
          bash --version | head -n1; shellcheck --version | sed -n 2p; jq --version; tmux -V; python3 --version; git --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # as a user, not as the container's root: root passes every permission check, so the tests
      # of a mode or an unwritable dir would prove nothing. The monitor's venv straight from PyPI.
      # bash for pipefail: tee must not hide the check's exit status.
      - name: Local check
        shell: bash
        run: |
          useradd -m -d /var/lib/ci ci
          chown -R ci "$GITHUB_WORKSPACE"
          runuser -u ci -- python3 -m venv /var/lib/ci/venv
          runuser -u ci -- /var/lib/ci/venv/bin/pip install --quiet --disable-pip-version-check -r lib/canccu-monitor.requirements.txt
          runuser -u ci -- env HOME=/var/lib/ci CANCCU_TEST_TIMEOUT=20m CANCCU_VENV=/var/lib/ci/venv CANCCU_TEST_LOGS=/var/lib/ci/test-logs tests/run | tee "$RUNNER_TEMP/check.out"

      # the parts whose summary line says FAILED, for the nightly report
      - name: Failed parts
        id: failed
        if: failure()
        run: |
          f=""
          [ -f "$RUNNER_TEMP/check.out" ] && f=$(grep -E '^(lint|monitor|tests/[^ ]+\.sh): FAILED' "$RUNNER_TEMP/check.out" | sed -E 's/: FAILED.*//' | paste -sd' ' -)
          echo "failed=$f" >> "$GITHUB_OUTPUT"

      - name: Full logs of a failed check
        if: failure()
        run: |
          for f in /var/lib/ci/test-logs/*.log; do echo "::group::${f##*/}"; cat "$f"; echo "::endgroup::"; done

  report:
    name: Report
    needs: [oldstable]
    if: always() && needs.oldstable.result != 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # no repo code at all; the values reach the script through env, never interpolated
      - name: Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.oldstable.outputs.failed }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly: the full check on Debian 12 failed'
          failed=${FAILED:-}
          [ -n "$failed" ] || failed='no list, the job did not finish'
          body="The full check on Debian 12 failed on $SHA. Failed: $failed. Run: $RUN_URL"
          # two steps: a failed lookup must make the step red, not look like "no open issue"
          issues=$(gh issue list --state open --search "\"$title\" in:title" --limit 100 --json number,title)
          n=$(jq -r --arg t "$title" 'map(select(.title == $t))[0].number // empty' <<<"$issues")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
