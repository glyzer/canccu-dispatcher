# shellcheck shell=bash disable=SC2034
# The host profile pro: a host on a Claude Pro plan: one run at a time, the same budgets as max.
# The Pro limit is parallelism, not run length: shorter runs stopped follow-ups midway through a
# test suite, and the usage keys below still guard the plan's window. Read after
# lib/canccu-config.default and before ~/.canccu/config (which overrides any of it), when
# HOST_PROFILE=pro. It sets no model: MODEL and the review models stay the host's own choice. A
# profile never sets HOST_PROFILE.
CAP=1
TOTAL_CAP=1
BUDGET_WORK="250 80 150"
BUDGET_RESUME="80 20 45"
BUDGET_REVIEW="60 15 40"
BUDGET_FIXCHECK="30 6 20"
BUDGET_ANSWER="40 10 20"
BUDGET_PLAN="60 10 30"
BUDGET_HEALTH="250 60 150"
BUDGET_PACKAGE_MAX="600 200 360"
STEP_BUDGET=400
USAGE_SLOW=80
USAGE_STOP=95
USAGE_WEEKLY_DRAIN=90
REVIEW_EFFORT_MAX=medium
