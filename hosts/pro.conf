# shellcheck shell=bash disable=SC2034
# The host profile pro: a host on a Claude Pro plan: one run at a time, small budgets. Read after
# lib/canccu-config.default and before ~/.canccu/config (which overrides any of it), when
# HOST_PROFILE=pro. A Pro host has run with these values; they are not tuned here. It sets the
# run models; ~/.canccu/config or the project's config overrides any of them. A profile never
# sets HOST_PROFILE.
CAP=1
TOTAL_CAP=1
BUDGET_WORK="120 25 120"
BUDGET_RESUME="40 8 30"
BUDGET_REVIEW="30 6 30"
BUDGET_FIXCHECK="15 3 15"
BUDGET_ANSWER="20 4 15"
BUDGET_PLAN="30 4 20"
BUDGET_HEALTH="120 25 90"
BUDGET_PACKAGE_MAX="300 60 200"
STEP_BUDGET=120
USAGE_SLOW=80
USAGE_STOP=95
USAGE_WEEKLY_DRAIN=90
REVIEW_EFFORT_MAX=medium
MODEL=claude-sonnet-5-5
FIX_MODEL=claude-sonnet-5-5
PLAN_MODEL=claude-opus-5-5
REVIEW_MODEL=claude-opus-5-5
REVIEW_MODEL_LIGHT=claude-sonnet-5-5
FIXCHECK_MODEL=claude-sonnet-5-5
HEALTH_MODEL=claude-sonnet-5-5
