# shellcheck shell=bash disable=SC2034
# The host profile max: a host on a Claude Max plan. Read after lib/canccu-config.default and
# before ~/.canccu/config (which overrides any of it), when HOST_PROFILE=max. It pins today's
# defaults for the keys that depend on the plan's limits, so a later change to the defaults does
# not move a running host. It sets the run models; ~/.canccu/config or the project's config
# overrides any of them. A profile never sets HOST_PROFILE. It changes only what depends on the
# subscription (caps, budgets, thresholds, models, effort, test tier), never which workflow features
# are on.
# Two runs at once, not the default three: the v2 workflow runs every review on Opus.
CAP=2
TOTAL_CAP=2
BUDGET_WORK="250 80 150"
BUDGET_RESUME="80 20 45"
BUDGET_REVIEW="60 15 40"
BUDGET_FIXCHECK="30 6 20"
BUDGET_ANSWER="40 10 20"
BUDGET_PLAN="60 10 30"
BUDGET_HEALTH="250 60 150"
BUDGET_PACKAGE_MAX="600 200 360"
STEP_BUDGET=400
USAGE_SLOW=60
USAGE_STOP=90
USAGE_WEEKLY_DRAIN=90
MODEL=claude-opus-5-5
PLAN_MODEL=claude-opus-5-5
REVIEW_MODEL=claude-opus-5-5
# v2: every review and fix-check on Opus, the light ones too
REVIEW_MODEL_LIGHT=
FIXCHECK_MODEL=
REVIEW_EFFORT_MAX=high
DEEP_REVIEW_EFFORT=high
# a worker tests only what it touched plus the repo checks; CI runs the full suite (#250)
TEST_TIER=targeted
